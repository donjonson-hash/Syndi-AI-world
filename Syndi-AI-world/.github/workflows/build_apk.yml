name: 🚀 Build Syndi AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      # Генерируем иконки если их нет
      - name: 🎨 Generate app icons
        run: |
          # Создаём директории для иконок
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Создаём простые цветные иконки через ImageMagick или скачиваем заглушку
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Генерируем простую иконку (синий круг с буквой S)
          for size in 48 72 96 144 192; do
            case $size in
              48) dir="mipmap-mdpi" ;;
              72) dir="mipmap-hdpi" ;;
              96) dir="mipmap-xhdpi" ;;
              144) dir="mipmap-xxhdpi" ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            
            convert -size ${size}x${size} xc:#667eea \
              -pointsize $(($size/3)) -fill white -gravity center \
              -annotate +0+0 "S" android/app/src/main/res/$dir/ic_launcher.png
            
            # Копируем как round icon тоже
            cp android/app/src/main/res/$dir/ic_launcher.png \
               android/app/src/main/res/$dir/ic_launcher_round.png
          done
          
          echo "✅ Icons generated"
      
      - name: 📦 Get dependencies
        run: flutter pub get
      
      - name: 🔨 Build APK
        run: flutter build apk --release
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syndi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
