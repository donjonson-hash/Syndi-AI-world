name: 🚀 Build Syndi AI APK

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**/*.dart'
      - '**/pubspec.yaml'
      - '**/pubspec.lock'
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия APK (например: 1.0.0)'
        required: false
        default: ''

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Setup Java
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      # Setup Flutter
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      # Find project directory
      - name: 🔍 Find Flutter project
        id: find-project
        run: |
          # Ищем pubspec.yaml
          PROJECT_PATH=$(find . -name "pubspec.yaml" -not -path "./.git/*" -not -path "*/.dart_tool/*" | head -1 | xargs dirname)
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_OUTPUT
          echo "📁 Найден проект: $PROJECT_PATH"
      
      # Cache dependencies
      - name: 💾 Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ steps.find-project.outputs.PROJECT_PATH }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      # Install dependencies
      - name: 📦 Get dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_PATH }}
        run: |
          flutter pub get
          flutter --version
      
      # Analyze
      - name: 🔍 Analyze code
        working-directory: ${{ steps.find-project.outputs.PROJECT_PATH }}
        run: flutter analyze --no-fatal-infos || true
      
      # Build APK
      - name: 🏗️ Build Release APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_PATH }}
        run: |
          BUILD_NAME="${{ github.event.inputs.version || '1.0.0' }}"
          BUILD_NUMBER="${{ github.run_number }}"
          flutter build apk --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER
      
      # Rename APK with version
      - name: 📝 Rename APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_PATH }}
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          BUILD="${{ github.run_number }}"
          COMMIT="${{ github.sha }}"
          SHORT_COMMIT="${COMMIT:0:7}"
          
          mkdir -p ../../apk_output
          
          mv build/app/outputs/flutter-apk/app-release.apk \
             ../../apk_output/syndi-ai-v${VERSION}+${BUILD}-${SHORT_COMMIT}.apk
          
          echo "✅ APK переименован в: syndi-ai-v${VERSION}+${BUILD}-${SHORT_COMMIT}.apk"
      
      # Upload artifact
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syndi-ai-apk-${{ github.run_number }}
          path: apk_output/*.apk
          retention-days: 30
      
      # Create Release (only on main/master branch)
      - name: 🎉 Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}+${{ github.run_number }}
          name: "Syndi AI v${{ github.event.inputs.version || '1.0.0' }} Build ${{ github.run_number }}"
          files: apk_output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
