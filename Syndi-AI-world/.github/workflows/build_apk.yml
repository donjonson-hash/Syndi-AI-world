name: 🚀 Build Syndi AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: 🛠️ Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      
      - name: 🎨 Generate app icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          for size in 48 72 96 144 192; do
            case $size in
              48) dir="mipmap-mdpi" ;;
              72) dir="mipmap-hdpi" ;;
              96) dir="mipmap-xhdpi" ;;
              144) dir="mipmap-xxhdpi" ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            
            convert -size ${size}x${size} xc:#667eea \
              -pointsize $(($size/2)) -fill white -gravity center \
              -annotate +0+0 "S" android/app/src/main/res/$dir/ic_launcher.png
            
            cp android/app/src/main/res/$dir/ic_launcher.png \
               android/app/src/main/res/$dir/ic_launcher_round.png
          done
          
          echo "✅ Icons generated:"
          find android/app/src/main/res/mipmap-* -name "*.png" | head -10
      
      - name: 📦 Get dependencies
        run: flutter pub get
      
      - name: 🔨 Build Release APK
        run: flutter build apk --release
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syndi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
