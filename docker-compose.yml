version: "3.9"

# ============================================================
# Syndi-AI Monorepo — production стек
# Структура:
#   nginx (80/443)
#     ├── /api/      → FastAPI backend (8000)
#     ├── /embed/    → Vector микросервис (8001)
#     ├── /bot/      → Kristina AI бот (8080)
#     └── /          → React frontend (3000)
# ============================================================

services:

  # ─── FastAPI backend ──────────────────────────────────────
  api:
    build:
      context: ./backend
      target: production
    container_name: syndi_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://syndi:${POSTGRES_PASSWORD:-syndi}@postgres:5432/syndi_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface

  # ─── Kristina AI бот (core/) ───────────────────────────
  kristina:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: syndi_kristina
    ports:
      - "8080:8080"
    env_file: ./core/.env
    environment:
      - DATABASE_URL=postgresql://syndi:${POSTGRES_PASSWORD:-syndi}@postgres:5432/syndi_db
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./core:/app
      - kristina_data:/app/data
    # Примечание: создайте core/Dockerfile после переноса файлов
    profiles:
      - full

  # ─── React фронтенд (frontend/) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syndi_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    # Примечание: создайте frontend/Dockerfile после переноса файлов
    profiles:
      - full

  # ─── Embed / Vector микросервис ──────────────────────
  embed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: syndi_embed
    command: uvicorn embed_server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBED_MODEL_RU=${EMBED_MODEL_RU:-paraphrase-multilingual-MiniLM-L12-v2}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model_cache:/root/.cache/huggingface

  # ─── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: syndi_postgres
    environment:
      POSTGRES_DB: syndi_db
      POSTGRES_USER: syndi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syndi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndi -d syndi_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: syndi_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Qdrant (vector DB) ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: syndi_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ─── Nginx reverse proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: syndi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - embed
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  model_cache:
  kristina_data:

# ────────────────────────────────────────────────────────
# Команды запуска:
#   docker compose up -d              — базовый стек (api+embed+db)
#   docker compose --profile full up -d — полный стек (вкл. бот и frontend)
# ────────────────────────────────────────────────────────
