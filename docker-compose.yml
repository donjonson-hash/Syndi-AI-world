version: "3.9"

# ============================================================
# Syndi-AI Monorepo — production стек
# Порты (не конфликтуют со старой системой на 8000-8082):
#   nginx     → 8090 (http), 8443 (https)
#     ├── /api/    → FastAPI backend  (9000)
#     ├── /embed/  → Vector сервис    (9001)
#     ├── /bot/    → Kristina bot     (9080)
#     └── /        → React frontend   (3000)
# ============================================================

services:

  # ─── FastAPI backend ──────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syndi_api
    ports:
      - "9000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://syndi:${POSTGRES_PASSWORD:-syndi}@postgres:5432/syndi_db
      - REDIS_URL=redis://redis:6380/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface

  # ─── Kristina AI бот (core/) ──────────────────────────────
  kristina:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: syndi_kristina
    ports:
      - "9080:8080"
    env_file: ./core/.env
    environment:
      - DATABASE_URL=postgresql://syndi:${POSTGRES_PASSWORD:-syndi}@postgres:5432/syndi_db
      - REDIS_URL=redis://redis:6380/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./core:/app
      - kristina_data:/app/data
    profiles:
      - full

  # ─── React фронтенд (frontend/) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://195.245.112.66:9000
        - VITE_WS_URL=ws://195.245.112.66:9000
    container_name: syndi_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - full

  # ─── Embed / Vector микросервис ───────────────────────────
  embed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syndi_embed
    command: uvicorn app.embed_server:app --host 0.0.0.0 --port 8001
    ports:
      - "9001:8001"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBED_MODEL_RU=${EMBED_MODEL_RU:-paraphrase-multilingual-MiniLM-L12-v2}
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - model_cache:/root/.cache/huggingface

  # ─── PostgreSQL (внутренний порт 5433 — не конфликтует) ───
  postgres:
    image: postgres:16-alpine
    container_name: syndi_postgres
    environment:
      POSTGRES_DB: syndi_db
      POSTGRES_USER: syndi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syndi}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndi -d syndi_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Redis (внутренний порт 6380 — не конфликтует) ────────
  redis:
    image: redis:7-alpine
    container_name: syndi_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Qdrant (vector DB) ───────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: syndi_qdrant
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ─── Nginx reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: syndi_nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - embed
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  model_cache:
  kristina_data:

# ──────────────────────────────────────────────────────────
# Команды запуска:
#   docker compose up -d                    — базовый стек
#   docker compose --profile full up -d    — полный стек
#
# Новые порты (безопасно со старой системой):
#   API:      http://195.245.112.66:9000
#   Embed:    http://195.245.112.66:9001
#   Frontend: http://195.245.112.66:3000
#   Bot:      http://195.245.112.66:9080
#   Nginx:    http://195.245.112.66:8090
#   Qdrant:   http://195.245.112.66:6334
#   Postgres: localhost:5433 (внутри Docker)
#   Redis:    localhost:6380 (внутри Docker)
# ──────────────────────────────────────────────────────────
