version: '3.8'

services:
  # FastAPI Backend
  syndi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndi-api
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - IONQ_API_KEY=${IONQ_API_KEY}
      - USE_REAL_QUANTUM=${USE_REAL_QUANTUM:-false}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - syndi-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  # Telegram Bot
  syndi-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndi-bot
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ADMIN_ID=${ADMIN_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - IONQ_API_KEY=${IONQ_API_KEY}
      - USE_REAL_QUANTUM=${USE_REAL_QUANTUM:-false}
      - API_URL=http://syndi-api:8000
    depends_on:
      - syndi-api
    restart: unless-stopped
    networks:
      - syndi-network
    command: python -m bot.main

  # Redis (for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: syndi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - syndi-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: syndi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - syndi-api
    restart: unless-stopped
    networks:
      - syndi-network

volumes:
  redis-data:

networks:
  syndi-network:
    driver: bridge
