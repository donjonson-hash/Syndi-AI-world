[pytest]
# Корень для импортов — папка backend/
pythonpath = .
testpaths = tests

# asyncio mode: auto — все async def test_* работают без @pytest.mark.asyncio вручную
asyncio_mode = auto

# Вывод: показывать короткие имена тестов + прогресс
addopts = -v --tb=short

# Убираем предупреждения pytest-asyncio о legacy mode
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio
    ignore::DeprecationWarning:httpx
