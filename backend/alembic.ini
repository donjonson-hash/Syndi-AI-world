[alembic]
# Путь к скриптам миграций (относительно backend/)
script_location = alembic

# URL переопределяется в env.py через os.getenv("DATABASE_URL")
# Здесь оставляем SQLite как дефолт для локального dev
sqlalchemy.url = sqlite+aiosqlite:///./startup_matcher.db

# Формат имён файлов миграций
file_template = %%(rev)s_%%(slug)s

# Timezone для дат в миграциях
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
