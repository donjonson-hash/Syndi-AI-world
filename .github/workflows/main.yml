name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Fix Project Structure
        run: |
          # Создаем symlink без кириллицы для надежности
          ln -s "Рабочий стол/Syndi-AIworld/syndi_mobile" ./syndi_mobile_fixed
          echo "PROJECT_PATH=./syndi_mobile_fixed" >> $GITHUB_ENV
          echo "✅ Создан symlink: ./syndi_mobile_fixed"

      - name: Fix Android Config
        run: |
          cd $PROJECT_PATH
          
          # AndroidX
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/g' android/app/build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          
          # ProGuard
          echo "-keep class io.flutter.** { *; }" > android/app/proguard-rules.pro

      - name: Build APK
        run: |
          cd $PROJECT_PATH
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Find and Upload APK
        run: |
          # Ищем APK в разных местах
          APK_PATH=$(find $PROJECT_PATH -name "app-release.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK не найден, ищем все APK:"
            find $PROJECT_PATH -name "*.apk" -type f 2>/dev/null
            ls -la $PROJECT_PATH/build/app/outputs/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ APK найден: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
