name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set Project Path
        id: locate
        run: |
          echo "PROJECT_PATH=./Рабочий стол/Syndi-AIworld/syndi_mobile" >> $GITHUB_OUTPUT

      - name: Fix AndroidX and Gradle
        run: |
          PROJECT_PATH="${{ steps.locate.outputs.PROJECT_PATH }}"
          
          # Fix gradle.properties - AndroidX
          GRADLE_PROPS="$PROJECT_PATH/android/gradle.properties"
          echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
          echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
          echo "✅ AndroidX enabled"
          
          # Fix build.gradle - shrinkResources
          BUILD_GRADLE="$PROJECT_PATH/android/app/build.gradle"
          sed -i 's/shrinkResources false/shrinkResources true/g' "$BUILD_GRADLE"
          sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE"
          echo "✅ Build config fixed"
          
          # Fix AndroidManifest.xml for AndroidX
          MANIFEST="$PROJECT_PATH/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Create ProGuard Rules
        run: |
          PROJECT_PATH="${{ steps.locate.outputs.PROJECT_PATH }}"
          PROGUARD_FILE="$PROJECT_PATH/android/app/proguard-rules.pro"
          if [ ! -f "$PROGUARD_FILE" ]; then
            echo "# Flutter" > "$PROGUARD_FILE"
            echo "-keep class io.flutter.** { *; }" >> "$PROGUARD_FILE"
            echo "-keep class io.flutter.plugins.** { *; }" >> "$PROGUARD_FILE"
            echo "-keepattributes *Annotation*" >> "$PROGUARD_FILE"
          fi

      - name: Clean and Get Dependencies
        working-directory: ${{ steps.locate.outputs.PROJECT_PATH }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.PROJECT_PATH }}
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log
        continue-on-error: true

      - name: Show Errors if Failed
        if: failure()
        working-directory: ${{ steps.locate.outputs.PROJECT_PATH }}
        run: |
          echo "=== BUILD ERRORS ==="
          cat build.log | grep -A 10 "Error:" || true
          cat build.log | tail -100

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.locate.outputs.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-release.apk
