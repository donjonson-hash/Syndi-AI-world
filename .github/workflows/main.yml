name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find Project
        run: |
          echo "=== ИЩЕМ ПРОЕКТ ==="
          PROJECT_PATH=$(find . -name "pubspec.yaml" -type f -exec dirname {} \; | head -1)
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "✅ Найден: $PROJECT_PATH"

      - name: Fix Android Build Config
        run: |
          cd "$PROJECT_PATH"
          echo "=== ИСПРАВЛЯЕМ BUILD.GRADLE ==="
          
          # Показываем текущее состояние
          echo "--- До исправления ---"
          grep -n "shrinkResources\|minifyEnabled" android/app/build.gradle || echo "Не найдено"
          
          # ВАЖНО: Отключаем shrinkResources и minifyEnabled для стабильности
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          sed -i 's/shrinkResources false/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled false/g' android/app/build.gradle
          
          echo "--- После исправления ---"
          grep -n "shrinkResources\|minifyEnabled" android/app/build.gradle || echo "Не найдено"
          
          # AndroidX
          if [ -f "android/gradle.properties" ]; then
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi
          
          # Права на gradlew
          chmod +x android/gradlew

      - name: Get Dependencies
        run: |
          cd "$PROJECT_PATH"
          flutter clean
          flutter pub get

      - name: Build Debug APK
        run: |
          cd "$PROJECT_PATH"
          flutter build apk --debug --verbose 2>&1 | tee build.log
        continue-on-error: true

      - name: Show Errors
        if: always()
        run: |
          cd "$PROJECT_PATH"
          echo "=== ОШИБКИ ==="
          tail -50 build.log
          grep -i "error\|failure\|what went wrong" build.log | head -10 || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-debug.apk
