name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find and Setup Project
        run: |
          echo "=== Поиск проекта ==="
          find . -name "pubspec.yaml" -path "*/syndi_mobile/*" -type f
          
          # Создаем symlink без пробелов
          PROJECT_PATH=$(find . -name "syndi_mobile" -type d | head -1)
          if [ -n "$PROJECT_PATH" ]; then
            ln -sf "$PROJECT_PATH" ./flutter_project
            echo "✅ Создан symlink: $PROJECT_PATH -> ./flutter_project"
          else
            echo "❌ Проект не найден"
            exit 1
          fi
          
          cd ./flutter_project
          
          # ⭐ ВАЖНО: Отключаем shrinkResources и minifyEnabled
          echo "=== Исправляем build.gradle ==="
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          sed -i 's/shrinkResources false/shrinkResources false/g' android/app/build.gradle
          
          echo "--- После исправления ---"
          grep -n "shrinkResources\|minifyEnabled" android/app/build.gradle || echo "Не найдено"
          
          # AndroidX настройки
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Права на gradlew
          chmod +x android/gradlew || true

      - name: Get Dependencies
        working-directory: ./flutter_project
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ./flutter_project
        continue-on-error: true
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" == "debug" ]; then
            flutter build apk --debug --verbose 2>&1 | tee build.log
          else
            flutter build apk --release --verbose 2>&1 | tee build.log
          fi

      - name: Show Errors
        if: always()
        working-directory: ./flutter_project
        run: |
          if [ -f build.log ]; then
            echo "=== ОШИБКИ СБОРКИ ==="
            tail -100 build.log
            grep -i "error\|failure\|what went wrong" build.log | head -10 || true
          fi
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "APK не созданы"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syndi-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: ./flutter_project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
