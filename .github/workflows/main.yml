name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find and Setup Project
        run: |
          echo "=== Поиск проекта ==="
          PROJECT_PATH=$(find . -type d -name "syndi_mobile" | head -1)
          
          if [ -n "$PROJECT_PATH" ]; then
            echo "✅ Проект найден: $PROJECT_PATH"
            ln -sf "$PROJECT_PATH" ./flutter_project
          else
            echo "❌ Проект 'syndi_mobile' не найден"
            exit 1
          fi
          
          cd ./flutter_project
          echo "=== Содержимое проекта ==="
          ls -la
          
          # ПОЛНОСТЬЮ ПЕРЕСОЗДАЕМ build.gradle
          echo "=== ПЕРЕСОЗДАЕМ build.gradle ==="
          
          cat > android/app/build.gradle << 'EOF'
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.syndi.mobile"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
EOF
          
          echo "✅ build.gradle пересоздан с отключенным shrinkResources"
          
          # Создаем gradle.properties
          cat > android/gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
EOF
          
          echo "✅ gradle.properties создан"
          
          # Создаем gradlew если его нет
          if [ ! -f "android/gradlew" ]; then
            echo "⚠️ gradlew не найден, создаем..."
            cd android
            gradle wrapper
            cd ..
          fi
          chmod +x android/gradlew
          echo "✅ gradlew готов"

      - name: Get Dependencies
        working-directory: ./flutter_project
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ./flutter_project
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "🚀 Сборка типа: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syndi-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: ./flutter_project/build/app/outputs/flutter-apk/*.apk
