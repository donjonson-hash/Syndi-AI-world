name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # core — быстрые тесты: только основные зависимости (~30 сек install)
  # ─────────────────────────────────────────────────────────────────────────────
  core:
    name: Core tests (no LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Run core tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_agents.py -q

  # ─────────────────────────────────────────────────────────────────────────────
  # optional — тесты агентов: ставит requirements-optional.txt поверх core
  # Запускается только на push в main (не на каждый PR)
  # ─────────────────────────────────────────────────────────────────────────────
  optional:
    name: Agent tests (with LLM mocks)
    runs-on: ubuntu-latest
    needs: core                    # запускается только если core прошёл
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-optional.txt

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Install optional dependencies
        run: pip install -r requirements-optional.txt

      - name: Run agent tests
        env:
          OPENAI_API_KEY: "sk-mock-key-for-tests"
        run: pytest tests/test_agents.py -v --tb=short
