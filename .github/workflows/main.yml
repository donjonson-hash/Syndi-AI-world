name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**/syndi_mobile/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find and Setup Project
        run: |
          echo "=== Поиск проекта ==="
          find . -name "pubspec.yaml" -path "*/syndi_mobile/*" -type f
          
          # Создаем symlink без пробелов
          PROJECT_PATH=$(find . -name "syndi_mobile" -type d | head -1)
          if [ -n "$PROJECT_PATH" ]; then
            ln -sf "$PROJECT_PATH" ./flutter_project
            echo "✅ Создан symlink: $PROJECT_PATH -> ./flutter_project"
          else
            echo "❌ Проект не найден"
            exit 1
          fi
          
          cd ./flutter_project
          
          # AndroidX настройки
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Права на gradlew
          chmod +x android/gradlew || true
          
          echo "=== Структура проекта ==="
          ls -la

      - name: Get Dependencies
        working-directory: ./flutter_project
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ./flutter_project
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" == "debug" ]; then
            flutter build apk --debug --verbose
          else
            flutter build apk --release --verbose
          fi

      - name: Check Build Output
        if: always()
        run: |
          echo "=== Проверка выходных файлов ==="
          ls -la ./flutter_project/build/app/outputs/flutter-apk/ 2>/dev/null || echo "Директория не найдена"
          find ./flutter_project/build -name "*.apk" 2>/dev/null || echo "APK не найдены"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syndi-${{ github.event.inputs.build_type || 'release' }}-apk
          path: ./flutter_project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "### ✅ Сборка APK завершена" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Тип:** ${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Номер:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          ls -lh ./flutter_project/build/app/outputs/flutter-apk/*.apk 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- APK файлы не найдены" >> $GITHUB_STEP_SUMMARY
