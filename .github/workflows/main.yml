name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.project.android.enableResourceShrinking=false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find and Setup Project
        run: |
          echo "=== Поиск проекта ==="
          PROJECT_PATH=$(find . -type d -name "syndi_mobile" | head -1)
          
          if [ -n "$PROJECT_PATH" ]; then
            echo "✅ Проект найден: $PROJECT_PATH"
            ln -sf "$PROJECT_PATH" ./flutter_project
          else
            echo "❌ Проект 'syndi_mobile' не найден"
            exit 1
          fi
          
          cd ./flutter_project
          echo "=== Содержимое проекта ==="
          ls -la
          
          # Упрощенное исправление - создаем новый gradle.properties
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          echo "✅ gradle.properties создан"
          
          # Права на gradlew
          chmod +x android/gradlew || true
          echo "✅ gradlew permissions fixed"

      - name: Get Dependencies
        working-directory: ./flutter_project
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ./flutter_project
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "🚀 Сборка типа: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syndi-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: ./flutter_project/build/app/outputs/flutter-apk/*.apk
