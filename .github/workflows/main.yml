name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Fix Project Path
        run: |
          echo "=== ИЩЕМ ПРОЕКТ ==="
          find . -name "pubspec.yaml" -type f 2>/dev/null | head -5
          
          # Создаем symlink без кириллицы
          ln -s "Рабочий стол/Syndi-AIworld/syndi_mobile" ./project
          echo "✅ Создан symlink: ./project -> Рабочий стол/Syndi-AIworld/syndi_mobile"
          
          ls -la ./project

      - name: Check Flutter Environment
        run: |
          echo "=== FLUTTER DOCTOR ==="
          flutter doctor -v

      - name: Fix Android Configuration
        working-directory: ./project
        run: |
          echo "=== ИСПРАВЛЯЕМ КОНФИГУРАЦИЮ ==="
          
          # AndroidX
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "✅ AndroidX добавлен"
          
          # Отключаем shrinkResources для стабильности
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          echo "✅ Build.gradle исправлен"

      - name: Get Dependencies
        working-directory: ./project
        run: |
          flutter clean
          flutter pub get

      - name: Build APK with Logs
        working-directory: ./project
        run: |
          flutter build apk --release --verbose 2>&1 | tee build.log
        continue-on-error: true

      - name: Analyze Build Errors
        if: always()
        working-directory: ./project
        run: |
          echo "=========================================="
          echo "=== АНАЛИЗ ОШИБОК ==="
          echo "=========================================="
          
          if [ -f build.log ]; then
            echo "=== ПОСЛЕДНИЕ 100 СТРОК ==="
            tail -100 build.log
            
            echo ""
            echo "=== ОШИБКИ ==="
            grep -n "Error:" build.log | head -10 || echo "Ошибок Dart не найдено"
            grep -n -A 3 "FAILURE:" build.log | head -20 || echo "Ошибок Gradle не найдено"
          else
            echo "❌ build.log не создан"
          fi
          
          echo ""
          echo "=== ПОИСК APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK не найдены"

      - name: Upload APK if Success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ./project/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./project/build.log
