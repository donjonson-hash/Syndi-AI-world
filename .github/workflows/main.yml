name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Убирает предупреждение

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Find Flutter Project
        run: |
          echo "=== ИЩЕМ ПРОЕКТ ==="
          pwd
          ls -la
          
          # Ищем папку с pubspec.yaml
          PROJECT_PATH=$(find . -name "pubspec.yaml" -type f -exec dirname {} \; | head -1)
          
          if [ -n "$PROJECT_PATH" ]; then
            echo "✅ Найден проект: $PROJECT_PATH"
            echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          else
            echo "❌ Проект не найден!"
            exit 1
          fi
          
          # Показываем содержимое
          echo "=== СОДЕРЖИМОЕ ПРОЕКТА ==="
          ls -la $PROJECT_PATH

      - name: Check Flutter Environment
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          echo "=== FLUTTER DOCTOR ==="
          flutter doctor -v

      - name: Fix Android Configuration
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          echo "=== ИСПРАВЛЯЕМ КОНФИГУРАЦИЮ ==="
          
          # AndroidX
          if [ -f "android/gradle.properties" ]; then
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
            echo "✅ AndroidX добавлен"
          else
            echo "⚠️ android/gradle.properties не найден"
          fi
          
          # Отключаем shrinkResources для стабильности
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            echo "✅ Build.gradle исправлен"
          fi
          
          # Права на gradlew
          chmod +x android/gradlew 2>/dev/null || echo "⚠️ gradlew не найден"

      - name: Get Dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter clean
          flutter pub get

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter build apk --debug
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Upload Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: warn

      - name: Save Build Info
        if: always()
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          echo "=== ИНФОРМАЦИЯ О СБОРКЕ ===" > build-info.txt
          echo "Дата: $(date)" >> build-info.txt
          echo "Flutter: $(flutter --version)" >> build-info.txt
          echo "APK:" >> build-info.txt
          find . -name "*.apk" -type f >> build-info.txt
          
      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: ${{ env.PROJECT_PATH }}/build-info.txt
